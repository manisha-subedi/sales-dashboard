[project]
name = "sales-dashboard"
version = "0.1.0"
description = "Four years of Superstore sales in a Tableau dashboard and a web page."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["duckdb>=1.1", "xlrd>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
