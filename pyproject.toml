[project]
name = "sales-dashboard"
version = "0.2.0"
description = "Four years of sales at a European tech company, in a Tableau dashboard and a web page."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["duckdb>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
